name: release

on:
  workflow_dispatch:
  push:
    branches:
      - fix-8024-release

concurrency:
  group: fork-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: '24'
  CLIENT_DIR: client_v2
  RELEASE_BRANCH: fix-8024-release
  SUFFIX: fix-8024

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 100

      - name: Resolve version and release tag from fix branch
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch --tags https://github.com/AdguardTeam/AdGuardHome.git

          base_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' --exclude '*+*')"

          if [ -z "${base_tag}" ]; then
            echo "No stable tag matching vX.Y.Z was found on ${{ env.RELEASE_BRANCH }} history"
            exit 1
          fi

          release_tag="${base_tag}+${{ env.SUFFIX }}"

          echo "base_tag=${base_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "Resolved base tag: ${base_tag}"
          echo "Resolved release tag: ${release_tag}"

          published_tags="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[].tag_name')"
          if grep -Fxq -- "${release_tag}" <<< "${published_tags}"; then
            echo 'release_exists=true' >> "${GITHUB_OUTPUT}"
            echo 'Release already exists; published tags and assets will be preserved.'
          else
            echo 'release_exists=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.CLIENT_DIR }}/package-lock.json

      - name: Build release artifacts (linux/amd64)
        run: |
          make \
            SHELL=/bin/bash \
            CLIENT_DIR="${{ env.CLIENT_DIR }}" \
            CHANNEL=release \
            SIGN=0 \
            VERSION="${{ steps.version.outputs.release_tag }}" \
            OS=linux \
            ARCH=amd64 \
            VERBOSE=1 \
            build-release pack-release

          printf 'version=%s\n' "${{ steps.version.outputs.release_tag }}" > dist/version.txt

          python3 - <<'PYMETADATA'
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote, urlparse

          path = Path('dist/version.json')
          data = json.loads(path.read_text())
          release_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases"
          data['announcement_url'] = f"{release_url}/tag/{quote(data['version'], safe='')}"
          for key, value in list(data.items()):
              if key.startswith('download_'):
                  filename = Path(urlparse(value).path).name
                  data[key] = f"{release_url}/download/{quote(data['version'], safe='')}/{filename}"
          path.write_text(json.dumps(data, indent=2) + '\n')
          PYMETADATA

      - name: Create GitHub release and upload assets
        if: ${{ steps.version.outputs.release_exists != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          target_commitish: ${{ env.RELEASE_BRANCH }}
          name: ${{ steps.version.outputs.release_tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/AdGuardHome_linux_amd64.tar.gz
            dist/AdGuardHome_frontend.tar.gz
            dist/checksums.txt
            dist/version.txt
            dist/version.json
